  /* les messages tout prêts : une rangée qui défile du doigt */
  #prets { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 8px 10px 2px; background: #fff; border-top: 1px solid #dfe5ec; scrollbar-width: none; }
  #prets::-webkit-scrollbar { display: none; }
  #prets button { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--doux); color: var(--fonce); font-size: 14.5px; font-weight: 600; white-space: nowrap; }
  #prets + footer { border-top: 0; }
</style>

  function photos(p) {
    document.querySelectorAll("#photos span").forEach(function (z) { var ch = p && p[z.dataset.p];
      if (ch && z.dataset.ch !== ch) { z.dataset.ch = ch; z.style.backgroundImage = 'url("' + adresse(ch) + '")'; z.textContent = ""; } });
  }
  function arreter() { clearInterval(veille); veille = null; }
  function ouvrir() {
    $("entree").hidden = true; $("appli").hidden = false; $("fil").innerHTML = '<button type="button" id="avant" hidden>Voir les messages plus anciens</button>';
    dernier = premier = 0; vus = {}; prets();
    $("avant").onclick = function () { lire(premier); };
    lire().then(function () { $("avant").hidden = Object.keys(vus).length < 60; $("fil").scrollTop = $("fil").scrollHeight; });
    arreter(); veille = setInterval(function () { if (!document.hidden) lire(); }, 3000);
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden && moi.code) lire(); });

  /* ---------- écrire, envoyer ---------- */
  var texte = $("texte"), bouton = $("envoyer");
  var FLECHE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  function etatBouton() { var plein = texte.value.trim() !== ""; bouton.innerHTML = FLECHE; bouton.style.opacity = plein ? "1" : ".45";
    texte.style.height = "46px"; texte.style.height = Math.max(46, Math.min(130, texte.scrollHeight + 2)) + "px"; }
  texte.addEventListener("input", etatBouton);
  function envoyer(t, chemin, type) {
    return appel("duo_envoyer", { p_code: moi.code, p_de: moi.qui, p_texte: t || "", p_chemin: chemin || null, p_type: type || null }).then(function () { return lire(); }).then(function () { $("fil").scrollTop = $("fil").scrollHeight; });
  }
  function prets() {
    var e = moi.qui === "Souad" ? "e" : "";
    var l = ["Bonjour, bien dormi ?", "J'arrive", "Je suis en route", "Bien arrivé" + e, "Je t'appelle dans cinq minutes", "Je suis occupé" + e + ", je te réponds après",
      "Tu rentres à quelle heure ?", "Tu as besoin de quelque chose ?", "Je pense à toi", "Tu me manques", "Je t'aime", "Bonne nuit"];
    var z = $("prets"); z.innerHTML = "";
    l.forEach(function (t) { var b = document.createElement("button"); b.type = "button"; b.textContent = t;
      b.onclick = function () { b.disabled = true; envoyer(t).catch(function (er) { toast(er.message); }).then(function () { b.disabled = false; }); }; z.appendChild(b); });
  }
  bouton.onclick = function () {
    var t = texte.value.trim(); if (!t) return texte.focus();
    bouton.disabled = true; texte.value = ""; etatBouton();
    envoyer(t).catch(function (e) { toast(e.message); texte.value = t; etatBouton(); }).then(function () { bouton.disabled = false; });
  };

  /* ---------- photos et vidéos ---------- */
  $("joindre").onclick = function () { $("fichier").click(); };
  // une photo de téléphone pèse plusieurs méga-octets : elle est ramenée à 1 920 pixels de côté avant de partir
  function reduire(f) {
    if (!/^image\/(jpeg|png|webp|heic)/.test(f.type)) return Promise.resolve(f);
    return createImageBitmap(f).then(function (im) { var k = Math.min(1, 1920 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); return new Promise(function (ok) { c.toBlob(function (b) { ok(b && b.size < f.size ? new File([b], "photo.jpg", { type: "image/jpeg" }) : f); }, "image/jpeg", .86); }); }).catch(function () { return f; });
  }
  function deposer(f, suivi) {
    var ext = (f.name.split(".").pop() || (/^video/.test(f.type) ? "mp4" : "jpg")).toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 5) || "bin";
    var nom = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)) + "." + ext, chemin = moi.dossier + "/" + nom;
    if (ESSAI) return new Promise(function (ok) { var r = new FileReader(); r.onload = function () { ok(f.size < 900000 ? r.result : "data:,trop-lourd-pour-l-essai"); }; r.readAsDataURL(f); });
    return new Promise(function (ok, non) { var x = new XMLHttpRequest(); x.open("POST", BASE + "/storage/v1/object/duo/" + chemin);
      x.setRequestHeader("apikey", CLE); x.setRequestHeader("Authorization", "Bearer " + CLE); x.setRequestHeader("Content-Type", f.type || "application/octet-stream"); x.setRequestHeader("x-upsert", "false");
      x.upload.onprogress = function (e) { if (e.lengthComputable) suivi(Math.round(100 * e.loaded / e.total)); };
      x.onload = function () { if (x.status >= 200 && x.status < 300) ok(chemin); else { var m = ""; try { m = JSON.parse(x.responseText).message; } catch (e) {} non(new Error(m || "Le fichier n'est pas parti (" + x.status + ").")); } };
      x.onerror = function () { non(new Error("Pas de connexion.")); }; x.send(f); });
  }
  $("fichier").onchange = function () {
    var liste = [].slice.call(this.files); this.value = ""; if (!liste.length) return;
    var z = document.createElement("div"); z.id = "envoi"; $("fil").appendChild(z); $("fil").scrollTop = $("fil").scrollHeight;
    var suite = Promise.resolve();
    liste.forEach(function (f, i) { suite = suite.then(function () {
      if (!/^(image|video)\//.test(f.type)) throw new Error("Seulement des photos et des vidéos.");
      if (f.size > 50 * 1024 * 1024) throw new Error("Cette vidéo dépasse 50 Mo : elle est trop lourde pour partir.");
      var quoi = (/^video/.test(f.type) ? "Vidéo" : "Photo") + (liste.length > 1 ? " " + (i + 1) + " sur " + liste.length : "");
      z.textContent = quoi + " : préparation…";
      return reduire(f).then(function (g) { return deposer(g, function (p) { z.textContent = quoi + " : " + p + " %"; }).then(function (chemin) { return envoyer("", chemin, g.type); }); });
    }); });
    suite.catch(function (e) { toast(e.message); }).then(function () { z.remove(); });
  };
  // sa propre photo : recadrée en carré, 400 pixels de côté
  function carre(f) {
    return createImageBitmap(f).then(function (im) { var c = Math.min(im.width, im.height), t = document.createElement("canvas"); t.width = t.height = 400;
      t.getContext("2d").drawImage(im, (im.width - c) / 2, (im.height - c) / 2, c, c, 0, 0, 400, 400);
      return new Promise(function (ok, non) { t.toBlob(function (b) { b ? ok(new File([b], "photo.jpg", { type: "image/jpeg" })) : non(new Error("Cette image ne se lit pas.")); }, "image/jpeg", .88); }); });
  }
  $("maPhoto").onclick = function () { $("menu").hidden = true; $("fichierPhoto").click(); };
  $("fichierPhoto").onchange = function () {
    var f = this.files[0]; this.value = ""; if (!f) return;
    carre(f).then(function (g) { return deposer(g, function () {}); }).then(function (chemin) { return appel("duo_photo", { p_code: moi.code, p_qui: moi.qui, p_chemin: chemin }); })
      .then(function () { toast("Votre photo est en place."); return lire(); }).catch(function (e) { toast(e.message || "La photo n'est pas partie."); });
  };
  $("grand").onclick = function () { $("grand").hidden = true; };

  /* ---------- le menu : notifications, installation, quitter ---------- */
  $("ouvrirMenu").onclick = function (e) { e.stopPropagation(); $("menu").hidden = !$("menu").hidden; };
  document.addEventListener("click", function (e) { if (!e.target.closest("#menu")) $("menu").hidden = true; });
  var enOctets = function (b) { var p = "=".repeat((4 - b.length % 4) % 4), s = atob((b + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, function (c) { return c.charCodeAt(0); }); };
  $("notif").onclick = function () {
    $("menu").hidden = true;
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("Ce téléphone ne sait pas recevoir de notifications ici. Sur iPhone, mettez d'abord l'appli sur l'écran d'accueil.");
    Notification.requestPermission().then(function (p) { if (p !== "granted") throw new Error("Les notifications sont refusées dans les réglages du téléphone.");
      return navigator.serviceWorker.register("/mohamed-et-souad/sw.js", { scope: "/mohamed-et-souad/" }); }).then(function () { return navigator.serviceWorker.ready; })
      .then(function (reg) { return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: enOctets(VAPID) }); })
      .then(function (ab) { var j = ab.toJSON(); return appel("duo_abonner", { p_code: moi.code, p_qui: moi.qui, p_endpoint: j.endpoint, p_cles: j.keys }); })
      .then(function () { toast("Ce téléphone sonnera à chaque message"); }).catch(function (e) { toast(e.message || "Les notifications n'ont pas pu être activées."); });
  };
  var invite = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); invite = e; $("installer").hidden = false; });
  $("installer").onclick = function () { $("menu").hidden = true; if (invite) { invite.prompt(); invite = null; $("installer").hidden = true; } };
  $("sortir").onclick = function () { $("menu").hidden = true; if (!confirm("Quitter la messagerie sur ce téléphone ? Les messages restent ; il faudra retaper le code pour revenir.")) return; moi = {}; garder(); arreter(); ecranEntree(); };
  if ("serviceWorker" in navigator && !ESSAI) navigator.serviceWorker.register("/mohamed-et-souad/sw.js", { scope: "/mohamed-et-souad/" }).catch(function () {});

  /* ---------- départ ---------- */
  etatBouton();
  if (moi.code && moi.qui) appel("duo_ouvrir", { p_code: moi.code }).then(function (r) { if (!r.ok) throw 0; moi.dossier = r.dossier; garder(); ouvrir(); }).catch(function () { ecranEntree(); });
  else ecranEntree();
})();
</script>
