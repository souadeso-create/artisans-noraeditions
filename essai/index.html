<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Votre site, premier essai · Nora Éditions</title>
<meta name="theme-color" content="#0f1240">
<link rel="icon" type="image/png" sizes="32x32" href="/medias/favicon-site-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --fond: #f4f5fb; --pierre: #eceef8; --sable: #dcdff0; --encre: #14152e; --gris: #6b7090; --clair: #9aa0bd; --filet: #5b4bff; --ok: #0b6b3c;
    --nuit: #0f1240; --jaune: #ffd426; --serif: "Bricolage Grotesque", Inter, Arial, sans-serif; --sans: "Inter", Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--fond); color: var(--encre); line-height: 1.55; font-size: 15px; }
  header { background: var(--nuit); color: #fff; }
  header .in, main { max-width: 820px; margin: 0 auto; padding: 0 16px; }
  header .in { height: 62px; display: flex; align-items: center; justify-content: space-between; }
  header .marque { display: flex; align-items: center; gap: 10px; color: #fff; }
  header img { height: 34px; width: 34px; border-radius: 10px; }
  header b { display: block; font: 800 15px var(--serif); letter-spacing: .04em; color: #fff; } header small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--jaune); text-transform: uppercase; }
  header a { font-size: 14px; color: #c9ccf5; text-decoration: none; }
  main { padding-top: 30px; padding-bottom: 60px; }
  h1 { font-family: var(--serif); font-weight: 800; font-size: clamp(30px, 8vw, 44px); line-height: 1.1; }
  h2 { font-family: var(--serif); font-weight: 800; font-size: 22px; margin-bottom: 12px; }
  .label { display: inline-flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--gris); margin-bottom: 14px; }
  .label::before { content: ""; width: 28px; height: 1px; background: var(--filet); }
  .gris { color: var(--gris); }
  .carte { background: #fff; border-radius: 16px; padding: 18px; margin-top: 18px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 22px rgba(0,0,0,.04); }
  .infos { display: grid; gap: 14px; }
  .infos b { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gris); font-weight: 600; margin-bottom: 2px; }
  .lot h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--sable); margin-bottom: 4px; }
  .ligne { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--pierre); }
  .ligne small { display: block; color: var(--gris); }
  .ligne .m { white-space: nowrap; font-weight: 500; }
  .lot + .lot { margin-top: 18px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; }
  .total b { font-family: var(--serif); font-weight: 800; font-size: 30px; }
  .conditions { font-size: 13px; color: var(--gris); white-space: pre-line; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; font: 600 15px var(--sans); padding: 15px 24px; border-radius: 999px; border: 1px solid var(--nuit); background: var(--nuit); color: #fff; cursor: pointer; text-decoration: none; }
  .btn.clair { background: transparent; color: var(--encre); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  form label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gris); margin: 14px 0 6px; }
  form input[type=text] { width: 100%; font: 16px var(--sans); padding: 14px 16px; border: 1px solid var(--sable); border-radius: 12px; background: var(--fond); }
  .case { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--encre); }
  .case input { width: 20px; height: 20px; flex: none; margin-top: 2px; accent-color: var(--encre); }
  .signe { background: #e3f0e8; color: var(--ok); }
  .signe b { font-family: var(--serif); font-weight: 800; font-size: 24px; display: block; }
  .vide { text-align: center; padding: 60px 10px; color: var(--gris); }
  .erreur { color: #a3261f; margin-top: 10px; font-size: 14px; }
  footer { font-size: 12px; color: var(--clair); text-align: center; padding: 0 16px 30px; }
  @media (min-width: 700px) { .infos { grid-template-columns: repeat(3, 1fr); } }
  .choix { display: grid; gap: 10px; margin-top: 10px; }
  .choix label { display: flex; gap: 12px; align-items: center; margin: 0; padding: 14px 16px; border: 1px solid var(--sable); border-radius: 14px; background: var(--fond);
    font-size: 15px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--encre); cursor: pointer; }
  .choix label:has(input:checked) { border-color: var(--nuit); background: #fff; }
  .choix input { flex: none; width: 20px; height: 20px; accent-color: var(--nuit); }
  @media (max-width: 520px) { #contactHaut { display: none; } }
  form textarea { width: 100%; min-height: 130px; font: 16px var(--sans); padding: 14px 16px; border: 1px solid var(--sable); border-radius: 12px; background: var(--fond); resize: vertical; }
  .modifs[hidden] { display: none; }
  .apercu { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .demande { background: #fff4e0; color: #8a5300; }
  .demande b { font-family: var(--serif); font-weight: 800; font-size: 24px; display: block; }
</style>
</head>
<body>
<header><div class="in"><a class="marque" href="/"><img src="/medias/icone-site-512.png" alt=""><span><b>NORA ÉDITIONS</b><small>Création de site internet</small></span></a><a id="contactHaut" href="mailto:contact@noraeditions.com">contact@noraeditions.com</a></div></header>
<main id="vue"><p class="vide">Chargement…</p></main>
<footer>Nora Éditions · creation-site-internet.noraeditions.fr</footer>

<script src="/medias/supabase-config.js"></script>
<script>
  // le client regarde l'essai de son site, puis dit « c'est bon » ou demande des modifications, et signe de son nom
  const BASE = window.NORA_SB.url, CLE = window.NORA_SB.cle;
  const jeton = new URLSearchParams(location.search).get("v");
  const vue = document.getElementById("vue");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rpc = (f, corps) => fetch(`${BASE}/rest/v1/rpc/${f}`, { method: "POST", headers: { apikey: CLE, Authorization: "Bearer " + CLE, "Content-Type": "application/json" }, body: JSON.stringify(corps) });
  const politesse = c => c ? [c.civilite, c.nom].filter(Boolean).join(" ") : "";
  const quand = iso => new Date(iso).toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" });

  function reponse(v) {
    return v.reponse === "oui"
      ? `<div class="carte signe"><b>✓ Validé</b><p>le ${esc(quand(v.signe_le))} par ${esc(v.signe_nom)}. Merci ! Nous préparons la mise en ligne de votre site.</p></div>`
      : `<div class="carte demande"><b>Modifications demandées</b><p>le ${esc(quand(v.signe_le))} par ${esc(v.signe_nom)} :</p><p style="white-space:pre-line;margin-top:8px">${esc(v.modifications)}</p><p style="margin-top:8px">Merci ! Nous faisons les changements et nous vous renvoyons le site.</p></div>`;
  }

  function afficher(v) {
    const ent = v.entreprise || "Nora Éditions";
    vue.innerHTML = `
      <span class="label">Votre site · ${esc(v.titre)}</span>
      <h1>Bonjour ${esc(politesse(v.client))},<br>voici votre site.</h1>
      <p class="gris" style="margin-top:10px">Regardez-le tranquillement, sur votre téléphone et sur un ordinateur si vous pouvez. Puis dites-nous s'il vous convient, ou ce que vous voulez changer.</p>
      ${v.lien ? `<div class="carte apercu"><div><b style="display:block">Votre site, en essai</b><small class="gris">${esc(v.lien.replace(/^https?:\/\//, ""))}</small></div><a class="btn" href="${esc(v.lien)}" target="_blank" rel="noopener">Voir mon site →</a></div>` : ""}
      ${v.signe_le ? reponse(v) : `
      <form class="carte" id="f">
        <h2>Votre avis</h2>
        <div class="choix">
          <label><input type="radio" name="accord" value="oui"> C'est bon pour moi, vous pouvez le mettre en ligne</label>
          <label><input type="radio" name="accord" value="modifs"> Je voudrais des modifications</label>
        </div>
        <div class="modifs" id="zoneModifs" hidden>
          <label for="modifs">Les modifications que vous souhaitez</label>
          <textarea id="modifs" maxlength="4000" placeholder="Une modification par ligne : la page, ce qu'il faut changer. Par exemple : Accueil, mettre la photo de la cuisine en premier."></textarea>
        </div>
        <label for="nom">Votre nom, pour signer</label>
        <input type="text" id="nom" autocomplete="name" maxlength="120">
        <label class="case"><input type="checkbox" id="ok"> J'ai regardé l'essai de mon site, et cette réponse vaut signature.</label>
        <div class="actions"><button class="btn" id="envoyer" type="submit">Envoyer ma réponse</button></div>
        <p class="erreur" id="err"></p>
      </form>`}`;
    const f = document.getElementById("f"); if (!f) return;
    const zone = document.getElementById("zoneModifs");
    f.querySelectorAll('[name="accord"]').forEach(r => r.onchange = () => { zone.hidden = r.value !== "modifs" || !r.checked; });
    f.onsubmit = async e => {
      e.preventDefault();
      const err = document.getElementById("err"), choix = f.querySelector('[name="accord"]:checked'), nom = f.nom.value.trim(), modifs = f.modifs.value.trim();
      if (!choix) return err.textContent = "Dites-nous si le site vous convient, ou si vous voulez des modifications.";
      if (choix.value === "modifs" && modifs.length < 2) return err.textContent = "Écrivez les modifications que vous souhaitez.";
      if (nom.length < 2) return err.textContent = "Indiquez votre nom pour signer.";
      if (!f.ok.checked) return err.textContent = "Cochez la case pour confirmer votre réponse.";
      const b = document.getElementById("envoyer"); b.disabled = true; b.textContent = "Envoi…"; err.textContent = "";
      try {
        const r = await rpc("repondre_essai", { j: jeton, accord: choix.value === "oui", modifs, nom });
        if (!r.ok) throw new Error();
        const x = await r.json(); if (!x.ok) throw new Error();
        const l = await (await rpc("validation_public", { j: jeton })).json(); afficher(l);
        window.scrollTo(0, 0);
      } catch (e2) { b.disabled = false; b.textContent = "Envoyer ma réponse"; err.textContent = "L'envoi n'a pas abouti. Réessayez dans un instant."; }
    };
  }

  (async () => {
    if (!jeton) { vue.innerHTML = '<p class="vide">Ce lien est incomplet. Demandez-nous de vous le renvoyer.</p>'; return; }
    try {
      const v = await (await rpc("validation_public", { j: jeton })).json();
      if (!v || !v.titre) throw new Error();
      afficher(v);
    } catch (e) { vue.innerHTML = '<p class="vide">Ce lien n\'est plus valable. Demandez-nous de vous le renvoyer.</p>'; }
  })();
</script>
</body>
</html>
