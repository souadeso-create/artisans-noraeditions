      if (invite) { var v = invite; invite = null; v.prompt(); v.userChoice.then(function (c) { if (c && c.outcome === "accepted") { moi.installe = true; garder(); } else invite = v; preparer(); }).catch(preparer); return; }
      if (aide.installer && !iphone) { moi.installe = true; garder(); return preparer(); }   // second appui : il l'a fait à la main
      aide.installer = iphone ? "Sur iPhone : bouton Partager, puis « Sur l'écran d'accueil ». Ouvrez ensuite l'appli depuis son icône." : "Menu ⋮ du navigateur, puis « Ajouter à l'écran d'accueil ». Ensuite, touchez de nouveau ce bouton.";
      preparer();
    };
    var possible = "PushManager" in window && "serviceWorker" in navigator && window.Notification, refuse = possible && Notification.permission === "denied";
    var prevenu = possible ? !!moi.notif && Notification.permission === "granted" : !iphone || dedans;   // un téléphone qui ne sait pas : on ne le bloque pas
    n.classList.toggle("faite", !!(prevenu && possible)); nb.disabled = !!prevenu; nb.textContent = prevenu && possible ? "Notifications activées ✓" : "Activer les notifications";
    n.querySelector("span").textContent = prevenu ? (possible ? "" : "Ce téléphone ne sait pas recevoir de notifications ici.")
      : refuse ? "Elles sont bloquées pour cette appli : autorisez-les dans les réglages du téléphone, puis revenez."
      : !possible ? aide.notif || "" : "";
    nb.onclick = function () { if (!possible) { aide.notif = "Installez d'abord l'appli, puis ouvrez-la depuis son icône."; return preparer(); } $("notif").click(); };
    $("commencer").disabled = !(installee && prevenu);
  }
  $("commencer").onclick = function () { moi.pret = true; garder(); ouvrir(); };
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !$("prepa").hidden) preparer(); });
  var invite = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); invite = e; $("installer").hidden = false; if (!$("prepa").hidden) preparer(); });
  window.addEventListener("appinstalled", function () { moi.installe = true; garder(); if (!$("prepa").hidden) preparer(); });
  $("installer").onclick = function () { $("menu").hidden = true; if (invite) { invite.prompt(); invite = null; $("installer").hidden = true; } };
  $("sortir").onclick = function () { $("menu").hidden = true; if (!confirm("Quitter la messagerie sur ce téléphone ? Les messages restent ; il faudra retaper le code pour revenir.")) return; moi = {}; garder(); arreter(); ecranEntree(); };
  if ("serviceWorker" in navigator && !ESSAI) navigator.serviceWorker.register("/private/sw.js", { scope: "/private/" }).catch(function () {});

  /* ---------- départ ---------- */
  etatBouton(); appliquerFond();
  if (moi.code && moi.qui) appel("duo_ouvrir", { p_code: moi.code }).then(function (r) { if (!r.ok) throw 0; moi.dossier = r.dossier; return fabriquerCle(); }).then(function () { garder(); ouvrir(); }).catch(function () { ecranEntree(); });
  else ecranEntree();
})();
</script>
